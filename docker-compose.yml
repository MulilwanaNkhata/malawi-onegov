name: malawi-onegov

networks:
  onegov-net:
    driver: bridge

volumes:
  onegov-pgdata:
  onegov-minio-data:

x-node-env: &node-env
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
  AUDIT_SHARED_SECRET: ${AUDIT_SHARED_SECRET:-dev-insecure-audit-secret-change-me}
  AUDIT_SERVICE_URL: http://audit-service:4002
  SERVICE_SHARED_SECRET: ${SERVICE_SHARED_SECRET:-dev-insecure-service-secret-change-me}
  IDENTITY_SERVICE_URL: http://identity-service:4001
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-onegov}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-onegov-secret}
  MINIO_BUCKET: onegov-documents
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onegov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onegov}
      POSTGRES_DB: postgres
    volumes:
      - onegov-pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onegov}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [onegov-net]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [onegov-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-onegov}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-onegov-secret}
    volumes:
      - onegov-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [onegov-net]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-onegov} ${MINIO_ROOT_PASSWORD:-onegov-secret} &&
      mc mb -p local/onegov-documents &&
      mc anonymous set none local/onegov-documents &&
      echo 'bucket ready'
      "
    networks: [onegov-net]

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [onegov-net]

  audit-service:
    build:
      context: ./services/audit-service
    environment:
      <<: *node-env
      PORT: "4002"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/audit_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4002:4002"
    networks: [onegov-net]

  identity-service:
    build:
      context: ./services/identity-service
    environment:
      <<: *node-env
      PORT: "4001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/identity_db
      # Off by default for local dev: relaying a 30-second-lived TOTP code
      # through chat was the actual pain point, not MFA itself. Registration
      # still enrolls a secret and /auth/mfa/verify is fully intact --
      # set to "true" to require it again, no code changes needed.
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_started
    ports:
      - "4001:4001"
    networks: [onegov-net]

  workflow-service:
    build:
      context: ./services/workflow-service
    environment:
      <<: *node-env
      PORT: "4003"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/workflow_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4003:4003"
    networks: [onegov-net]

  document-service:
    build:
      context: ./services/document-service
    environment:
      <<: *node-env
      PORT: "4004"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/document_db
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "4004:4004"
    networks: [onegov-net]

  payment-service:
    build:
      context: ./services/payment-service
    environment:
      <<: *node-env
      PORT: "4005"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4005:4005"
    networks: [onegov-net]

  notification-service:
    build:
      context: ./services/notification-service
    environment:
      <<: *node-env
      PORT: "4006"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/notification_db
      CIVIL_REGISTRATION_SERVICE_URL: http://civil-registration-service:4007
      TRADING_LICENSE_SERVICE_URL: http://trading-license-service:4008
      COMPLAINTS_SERVICE_URL: http://complaints-service:4010
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4006:4006"
    networks: [onegov-net]

  civil-registration-service:
    build:
      context: ./services/civil-registration-service
    environment:
      <<: *node-env
      PORT: "4007"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/civilreg_db
      WORKFLOW_SERVICE_URL: http://workflow-service:4003
      PAYMENT_SERVICE_URL: http://payment-service:4005
      DOCUMENT_SERVICE_URL: http://document-service:4004
    depends_on:
      postgres:
        condition: service_healthy
      workflow-service:
        condition: service_started
      payment-service:
        condition: service_started
      document-service:
        condition: service_started
    ports:
      - "4007:4007"
    networks: [onegov-net]

  trading-license-service:
    build:
      context: ./services/trading-license-service
    environment:
      <<: *node-env
      PORT: "4008"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/trading_license_db
      WORKFLOW_SERVICE_URL: http://workflow-service:4003
      PAYMENT_SERVICE_URL: http://payment-service:4005
      DOCUMENT_SERVICE_URL: http://document-service:4004
    depends_on:
      postgres:
        condition: service_healthy
      workflow-service:
        condition: service_started
      payment-service:
        condition: service_started
      document-service:
        condition: service_started
    ports:
      - "4008:4008"
    networks: [onegov-net]

  complaints-service:
    build:
      context: ./services/complaints-service
    environment:
      <<: *node-env
      PORT: "4010"
      DATABASE_URL: postgresql://${POSTGRES_USER:-onegov}:${POSTGRES_PASSWORD:-onegov}@postgres:5432/complaints_db
      WORKFLOW_SERVICE_URL: http://workflow-service:4003
    depends_on:
      postgres:
        condition: service_healthy
      workflow-service:
        condition: service_started
    ports:
      - "4010:4010"
    networks: [onegov-net]

  ussd-gateway:
    build:
      context: ./services/ussd-gateway
    environment:
      <<: *node-env
      PORT: "4009"
      CIVIL_REGISTRATION_SERVICE_URL: http://civil-registration-service:4007
      TRADING_LICENSE_SERVICE_URL: http://trading-license-service:4008
      IDENTITY_SERVICE_URL: http://identity-service:4001
      PAYMENT_SERVICE_URL: http://payment-service:4005
    depends_on:
      civil-registration-service:
        condition: service_started
      trading-license-service:
        condition: service_started
      identity-service:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "4009:4009"
    networks: [onegov-net]

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      <<: *node-env
      PORT: "4000"
      IDENTITY_SERVICE_URL: http://identity-service:4001
      AUDIT_SERVICE_URL: http://audit-service:4002
      WORKFLOW_SERVICE_URL: http://workflow-service:4003
      DOCUMENT_SERVICE_URL: http://document-service:4004
      PAYMENT_SERVICE_URL: http://payment-service:4005
      NOTIFICATION_SERVICE_URL: http://notification-service:4006
      CIVIL_REGISTRATION_SERVICE_URL: http://civil-registration-service:4007
      TRADING_LICENSE_SERVICE_URL: http://trading-license-service:4008
      USSD_GATEWAY_URL: http://ussd-gateway:4009
      COMPLAINTS_SERVICE_URL: http://complaints-service:4010
    volumes:
      - ./docs/openapi.yaml:/app/openapi.yaml:ro
    depends_on:
      - identity-service
      - civil-registration-service
      - notification-service
      - trading-license-service
      - ussd-gateway
      - complaints-service
    ports:
      - "4000:4000"
    networks: [onegov-net]

  citizen-portal:
    build:
      context: ./apps/citizen-portal
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"
    networks: [onegov-net]
